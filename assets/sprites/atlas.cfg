# atlas.cfg - anh xa TEN sprite (dung 13 ten trong class SpriteSheet, src/sprites.h)
# -> vung toa do trong atlas.png. Dinh dang: NAME=X,Y,W,H (so nguyen, pixel, goc
# tren-trai atlas.png). Dong bat dau bang '#' la comment, dong trong bi bo qua.
# Thieu ten / dong loi (khong du 4 so, X+W hoac Y+H vuot bien atlas.png) -> ten do
# FALLBACK VE PROCEDURAL (BuildXxx() trong sprites.cpp), khong bao loi, khong crash
# - xem SpriteSheet::Load() de biet chi tiet co che nay.
#
# Nguon: Kenney "Space Shooter Redux" (kenney.nl, CC0). bossSentinel/bossSwarmer
# CO Y dung chung toa do voi tankyAlien/zigzagAlien (xem 2 dong cuoi) - anh gia lap
# xam (desaturate) de he thong tint co san (Color tint truyen vao DrawSprite() tai
# tung noi goi) tu quyet dinh mau cuoi cung, dung y het huong da co cho sprite
# procedural truoc day ("ve trang roi nhuom mau rieng tung loai").

player=10,12,99,75
basicAlien=128,8,104,84
tankyAlien=248,8,103,84
zigzagAlien=379,8,82,84
ufo=614,4,91,91
kamikaze=493,8,93,84
boss=731,8,97,84
bossSentinel=248,8,103,84
bossSwarmer=379,8,82,84
iconRapidFire=10,105,19,30
iconShield=45,105,30,30
iconPiercing=84,105,31,30
iconCleanser=124,104,32,32

# warden / medic (Phase 1a - Enemy & Item Revolution, Nguoi 1): CHUA co dong o day -
# atlas.png (840x140, xem anh) da kin cho, khong con vung 80-100px trong phu hop de map
# them 2 hinh moi ma khong tai su dung toa do cua loai khac (xem sprites.cpp de biet ly
# do khong tai su dung). Ca 2 ten dang dung fallback procedural (BuildWarden()/
# BuildMedic() trong sprites.cpp - hinh ngu giac rong va chu thap). Neu sau nay mo rong
# atlas.png (them cot moi) va co vung Kenney phu hop, chi can them 2 dong
# "warden=X,Y,W,H" / "medic=X,Y,W,H" o day - SpriteSheet::Load() tu dong chuyen sang
# dung anh that, khong can sua code.

# iconSpreadShot / iconOverdrive (Phase 1b - Enemy & Item Revolution, Nguoi 1): cung ly
# do nhu warden/medic o tren - atlas.png da kin cho, ca 2 ten dung fallback procedural
# (BuildIconSpreadShot()/BuildIconOverdrive() trong sprites.cpp). Them 2 dong
# "iconSpreadShot=X,Y,W,H" / "iconOverdrive=X,Y,W,H" o day sau neu co vung Kenney phu
# hop - khong can sua code, dung quy uoc voi warden/medic.
