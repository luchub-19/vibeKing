# atlas.cfg - anh xa TEN sprite (dung trong class SpriteSheet, src/sprites.h) -> vung toa
# do trong atlas.png. Dinh dang: NAME=X,Y,W,H (so nguyen, pixel, goc tren-trai atlas.png).
# Dong bat dau bang '#' la comment, dong trong bi bo qua.
# Thieu ten / dong loi (khong du 4 so, X+W hoac Y+H vuot bien atlas.png) -> ten do
# FALLBACK VE PROCEDURAL (BuildXxx() trong sprites.cpp), khong bao loi, khong crash
# - xem SpriteSheet::Load() de biet chi tiet co che nay.
#
# Nguon: Kenney "Space Shooter Redux" (kenney.nl, CC0).

player=10,12,99,75
basicAlien=128,8,104,84
tankyAlien=248,8,103,84
zigzagAlien=379,8,82,84
ufo=614,4,91,91
kamikaze=493,8,93,84
boss=731,8,97,84
iconRapidFire=10,105,19,30
iconShield=45,105,30,30
iconPiercing=84,105,31,30
iconCleanser=124,104,32,32

# warden / medic (Phase 1a - Enemy & Item Revolution, Nguoi 1): CHUA co dong o day -
# atlas.png (840x140, xem anh) da kin cho, khong con vung 80-100px trong phu hop de map
# them 2 hinh moi ma khong tai su dung toa do cua loai khac (xem sprites.cpp de biet ly
# do khong tai su dung). Ca 2 ten dang dung fallback procedural (BuildWarden()/
# BuildMedic() trong sprites.cpp - hinh ngu giac rong va chu thap). Neu sau nay mo rong
# atlas.png (them cot moi) va co vung Kenney phu hop, chi can them 2 dong
# "warden=X,Y,W,H" / "medic=X,Y,W,H" o day - SpriteSheet::Load() tu dong chuyen sang
# dung anh that, khong can sua code.

# iconSpreadShot / iconOverdrive (Phase 1b - Enemy & Item Revolution, Nguoi 1): cung ly
# do nhu warden/medic o tren - atlas.png da kin cho, ca 2 ten dung fallback procedural
# (BuildIconSpreadShot()/BuildIconOverdrive() trong sprites.cpp). Them 2 dong
# "iconSpreadShot=X,Y,W,H" / "iconOverdrive=X,Y,W,H" o day sau neu co vung Kenney phu
# hop - khong can sua code, dung quy uoc voi warden/medic.

# weaver / bomber (Phase 2 - Enemy & Item Revolution, Nguoi 1): cung ly do nhu warden/
# medic/iconSpreadShot/iconOverdrive o tren - atlas.png da kin cho, dung fallback
# procedural (BuildWeaver()/BuildBomber() trong sprites.cpp). Them 2 dong
# "weaver=X,Y,W,H" / "bomber=X,Y,W,H" o day sau neu co vung Kenney phu hop - khong can
# sua code.

# bossSentinel / bossSwarmer (Phase 4 - Enemy & Item Revolution, "don no"): TRUOC DAY 2
# ten nay tro CHUNG toa do voi tankyAlien/zigzagAlien (dung chung anh, chi khac mau tint
# luc DrawSprite()) - Boss loai 2/3 va 3/3 vi vay nhin giong het Tanky/Zigzag phong to,
# khong co dang rieng. Da BO 2 dong do: gio ca 2 ten deu KHONG co trong atlas.cfg nay (cung
# ly do voi warden/medic/iconSpreadShot/iconOverdrive/weaver/bomber o tren - atlas.png da
# kin cho, khong con vung rieng de map anh that), roi ve dung
# BuildBossSentinel()/BuildBossSwarmer() trong sprites.cpp - 2 ham nay VON DA TON TAI SAN
# (vong khien tron cho Sentinel, 4 vo tam giac "to ong" cho Swarmer) nhung truoc gio chua
# bao gio duoc dung toi vi atlas.cfg luon "che khuat" bang toa do gia lap o tren. Neu sau
# nay co vung Kenney rieng phu hop, chi can them lai "bossSentinel=X,Y,W,H" /
# "bossSwarmer=X,Y,W,H" o day.
