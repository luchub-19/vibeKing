# atlas.cfg - anh xa TEN sprite (dung trong class SpriteSheet, src/sprites.h) -> vung toa
# do trong atlas.png. Dinh dang: NAME=X,Y,W,H (so nguyen, pixel, goc tren-trai atlas.png).
# Dong bat dau bang '#' la comment, dong trong bi bo qua.
# Thieu ten / dong loi (khong du 4 so, X+W hoac Y+H vuot bien atlas.png) -> ten do
# FALLBACK VE PROCEDURAL (BuildXxx() trong sprites.cpp), khong bao loi, khong crash
# - xem SpriteSheet::Load() de biet chi tiet co che nay.
#
# Nguon: Kenney "Space Shooter Redux" (kenney.nl, CC0).

